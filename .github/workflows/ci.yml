name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-mock flake8 black

      - name: Lint (syntax errors and undefined names)
        run: flake8 src/mcp_mikrotik/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Formatting
        run: black --check src/ tests/unit/

      - name: Import check (server and tool registry load)
        run: python -c "from mcp_mikrotik.tools.tool_registry import get_all_tools; print(len(get_all_tools()), 'tools registered')"

      - name: Unit tests (no router required)
        run: python -m pytest tests/unit -q
